# MachineConfig: embeds nmstate/control02-br-ex.yaml (base64) into /etc/nmstate/openshift/control02.yml
# on the master pool. Apply with: oc apply -f machineconfigs/control02-br-ex-nmstate.yaml
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-control02-br-ex-nmstate
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        mode: 0644
        overwrite: true
        path: /etc/nmstate/openshift/control02.yml

# MachineConfig: embeds nmstate/arbiter-br-ex.yaml (base64) into /etc/nmstate/openshift/cluster.yml
# on the arbiter pool. Apply with: oc apply -f machineconfigs/arbiter-br-ex-nmstate.yaml
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: arbiter
  name: 99-arbiter-br-ex-nmstate
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        mode: 0644
        overwrite: true
        path: /etc/nmstate/openshift/cluster.yml
